services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      # Volumen separado para el modelo — Docker lo inicializa desde la imagen
      - whisper_model:/app/models/whisper
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "5678:5678"
    volumes:
      - ./frontend:/app
      # Preservar node_modules del contenedor (no sobreescribir con los del host)
      - /app/node_modules
    environment:
      - VITE_BACKEND_HOST=http://backend:8000
    depends_on:
      - backend

volumes:
  whisper_model:
